<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northstar Checkout</title>
    <style>
      :root { color-scheme: light; font-family: Segoe UI, Arial, sans-serif; color: #182230; background: #f3f6fa; }
      body { margin: 0; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px 56px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 28px; }
      .eyebrow { margin: 0 0 6px; color: #526173; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, .8fr); gap: 20px; }
      .panel { background: white; border: 1px solid #d9e1ea; border-radius: 14px; padding: 22px; box-shadow: 0 6px 22px #20334a0b; }
      .product { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-bottom: 1px solid #e7ecf1; }
      .product:last-of-type { border-bottom: 0; }
      .product p { margin: 4px 0 0; color: #526173; font-size: 14px; }
      .price { font-weight: 700; white-space: nowrap; }
      label { display: block; margin: 18px 0 6px; font-size: 14px; font-weight: 600; }
      input, select { box-sizing: border-box; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      select { width: 100%; }
      input { width: 92px; }
      button { border: 0; border-radius: 8px; padding: 11px 16px; color: white; background: #2159c5; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #checkout { margin-top: 16px; width: 100%; }
      #message { min-height: 24px; margin-top: 14px; font-size: 14px; }
      .ok { color: #12653c; }
      .bad { color: #a32828; }
      .order { padding: 12px 0; border-bottom: 1px solid #e7ecf1; font-size: 14px; }
      .order:last-child { border-bottom: 0; }
      .muted { color: #526173; }
      @media (max-width: 680px) { .layout { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">Northstar demo store</p><h1>Checkout</h1></div>
        <span class="muted">Orders · Payments · Inventory</span>
      </header>
      <div class="layout">
        <section class="panel" aria-labelledby="catalog-heading">
          <h2 id="catalog-heading">Catalog</h2>
          <div id="products" class="muted">Loading products…</div>
          <label for="sku">Choose a product</label>
          <select id="sku"></select>
          <label for="quantity">Quantity</label>
          <input id="quantity" type="number" min="1" max="20" value="1">
          <button id="checkout" type="button">Place order</button>
          <div id="message" role="status" aria-live="polite"></div>
        </section>
        <section class="panel" aria-labelledby="orders-heading">
          <h2 id="orders-heading">Recent orders</h2>
          <div id="orders" class="muted">Loading orders…</div>
        </section>
      </div>
    </main>
    <script>
      const productContainer = document.querySelector("#products");
      const orderContainer = document.querySelector("#orders");
      const message = document.querySelector("#message");
      const button = document.querySelector("#checkout");
      let products = [];

      function money(cents) {
        return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(cents / 100);
      }

      async function loadProducts() {
        const response = await fetch("/api/products");
        if (!response.ok) throw new Error("Could not load the catalog.");
        products = await response.json();
        productContainer.replaceChildren();
        const selection = document.querySelector("#sku");
        const previousSku = selection.value;
        selection.replaceChildren();
        for (const product of products) {
          const item = document.createElement("div");
          item.className = "product";
          const description = document.createElement("div");
          const name = document.createElement("strong");
          name.textContent = product.name;
          const stock = document.createElement("p");
          stock.textContent = `${product.available} in stock`;
          description.append(name, stock);
          const price = document.createElement("span");
          price.className = "price";
          price.textContent = money(product.price_cents);
          item.append(description, price);
          productContainer.append(item);

          const option = document.createElement("option");
          option.value = product.sku;
          option.textContent = `${product.name} (${product.available} available)`;
          option.disabled = product.available < 1;
          selection.append(option);
        }
        if (products.some((product) => product.sku === previousSku && product.available > 0)) {
          selection.value = previousSku;
        }
        if (products.length === 0) productContainer.textContent = "No products are available.";
      }

      async function loadOrders() {
        const response = await fetch("/api/orders");
        if (!response.ok) throw new Error("Could not load recent orders.");
        const orders = await response.json();
        orderContainer.replaceChildren();
        if (orders.length === 0) {
          orderContainer.textContent = "No orders yet. Place one to start the demo.";
          orderContainer.className = "muted";
          return;
        }
        orderContainer.className = "";
        for (const order of orders) {
          const item = document.createElement("div");
          item.className = "order";
          const title = document.createElement("strong");
          title.textContent = `${order.product_name} × ${order.quantity}`;
          const details = document.createElement("div");
          details.className = "muted";
          details.textContent = `${order.status.toUpperCase()} · ${money(order.amount_cents)} · ${order.order_id.slice(0, 8)}`;
          item.append(title, details);
          if (order.failure_reason) {
            const reason = document.createElement("div");
            reason.className = "bad";
            reason.textContent = order.failure_reason;
            item.append(reason);
          }
          orderContainer.append(item);
        }
      }

      button.addEventListener("click", async () => {
        const selected = products.find((product) => product.sku === document.querySelector("#sku").value && product.available > 0);
        if (!selected) {
          message.className = "bad";
          message.textContent = "There is no stock available to order.";
          return;
        }
        const quantity = Number(document.querySelector("#quantity").value);
        if (!Number.isInteger(quantity) || quantity < 1 || quantity > 20) {
          message.className = "bad";
          message.textContent = "Enter a quantity from 1 to 20.";
          return;
        }
        button.disabled = true;
        message.className = "muted";
        message.textContent = "Processing checkout…";
        try {
          const response = await fetch("/api/orders", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID() },
            body: JSON.stringify({ sku: selected.sku, quantity })
          });
          const order = await response.json();
          if (!response.ok) throw new Error(order.detail || "Checkout request failed.");
          message.className = order.status === "confirmed" ? "ok" : "bad";
          message.textContent = order.status === "confirmed"
            ? `Order confirmed: ${order.order_id}`
            : `Order ${order.status}: ${order.failure_reason || "check recent orders for details"}`;
          await Promise.all([loadProducts(), loadOrders()]);
        } catch (error) {
          message.className = "bad";
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      Promise.all([loadProducts(), loadOrders()]).catch((error) => {
        message.className = "bad";
        message.textContent = error.message;
      });
    </script>
  </body>
</html>
