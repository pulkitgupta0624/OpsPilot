[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "A reproducible AIOps incident simulator and triage portfolio project"
readme = "readme.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyarrow>=18,<25",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "scikit-learn>=1.6,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "tenacity>=9.0,<10.0",
  "typer>=0.15,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29,<7.0",
  "jupyterlab>=4.3,<5.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
]
ml = [
  "drain3>=0.9.11,<1.0",
  "torch>=2.4,<3.0",
]
rag = [
  "qdrant-client>=1.12,<2.0",
  "rank-bm25>=0.2.2,<0.3",
  "sentence-transformers>=3.3,<6.0",
]
agents = [
  "langgraph>=0.2,<2.0",
  "langgraph-checkpoint-sqlite>=2.0,<4.0",
]
dashboard = [
  "plotly>=5.24,<7.0",
  "streamlit>=1.41,<2.0",
]
dev = [
  "alembic>=1.14,<2.0",
  "mypy>=1.13,<2.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
opspilot = "opspilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

