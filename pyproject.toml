[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "A reproducible AIOps incident simulator and triage portfolio project"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=18,<25",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.15,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29,<7.0",
  "jupyterlab>=4.3,<5.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
]
dev = [
  "mypy>=1.13,<2.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
opspilot = "opspilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

